server:
  port: 8081
  servlet:
    context-path: /morpheus

spring:
  application:
    name: morpheus
  aot:
    enabled: false
  kafka:
    bootstrap-servers: b-1.studiotrekkafkadev.opvmnn.c25.kafka.us-east-1.amazonaws.com, b-2.studiotrekkafkadev.opvmnn.c25.kafka.us-east-1.amazonaws.com
    topic:
      msk-topic: msk-topic
    listener:
      concurrency: 10
    consumer:
      group-id: mks-topic-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      bootstrap-servers: ${spring.kafka.bootstrap-servers}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.kafka: ERROR